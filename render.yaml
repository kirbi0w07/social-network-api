
services:
  - type: web
    name: social-network-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh docker/start-web.sh
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_KEY
        sync: false

      - key: DB_CONNECTION
        value: pgsql

      - key: DB_HOST
        fromDatabase:
          name: social_network_api
          property: host

      - key: DB_PORT
        fromDatabase:
          name: social_network_api
          property: port

      - key: DB_DATABASE
        fromDatabase:
          name: social_network_api
          property: database

      - key: DB_USERNAME
        fromDatabase:
          name: social_network_api
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: social_network_api
          property: password

      - key: REVERB_APP_ID
        value: mi-app

      - key: REVERB_APP_KEY
        generateValue: true

      - key: REVERB_APP_SECRET
        generateValue: true

      - key: REVERB_SERVER_HOST
        value: 0.0.0.0

databases:
  - name: social_network_api
    databaseName: social_network_api_97zy
    user: social_network_api_97zy_user
    region: oregon
    plan: free
