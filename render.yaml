
envVarGroups:
  - name: laravel-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: REVERB_APP_ID
        value: mi-app
      - key: REVERB_APP_KEY
        generateValue: true
      - key: REVERB_APP_SECRET
        generateValue: true
      - key: REVERB_SERVER_HOST
        value: 0.0.0.0

services:
  - type: web
    name: mi-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh docker/start-web.sh
    healthCheckPath: /up
    envVars:
      - fromGroup: laravel-shared
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_DATABASE
        value: social_network_api_97zy
      - key: DB_USERNAME
        value: social_network_api_97zy_user
      - key: DB_URL
        fromDatabase:
          name: social_network_api
          property: connectionString

databases:
  - name: social_network_api
    databaseName: social_network_api_97zy
    user: social_network_api_97zy_user
    region: oregon
    plan: free

